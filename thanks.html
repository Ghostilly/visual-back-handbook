<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Thank you · The Visual Back Handbook</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0A0E13;color:#EEF2F5;font:400 17px/1.6 Inter,system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}
.card{max-width:560px;width:100%;background:#141C25;border:1px solid #223040;border-radius:24px;padding:40px 30px;text-align:center}
.tick{width:64px;height:64px;border-radius:50%;background:#5FD3E6;color:#06222A;display:grid;place-items:center;font-size:32px;font-weight:700;margin:0 auto 22px}
h1{font-family:Fraunces,Georgia,serif;font-size:36px;line-height:1.15;margin-bottom:14px}
p{color:#9AA8B5}
p+p{margin-top:12px}
b{color:#EEF2F5}
a{display:inline-block;margin-top:26px;color:#5FD3E6;font-weight:600;text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <div class="tick">✓</div>
  <h1>You're in. Thank you.</h1>
  <p>Your founding pre-order of <b>The Visual Back Handbook</b> is confirmed. Paystack has emailed your receipt.</p>
  <p>You'll get access first, by email at the address you used at checkout, the moment the handbook opens.</p>
  <a href="./">← Back to the handbook</a>
</div>
</body>
